<!DOCTYPE index.html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personality Analyzer</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,sans-serif;
  background:#090b10;color:#fff;min-height:100vh;
  display:flex;justify-content:center;align-items:center;padding:18px
}
.app{
  width:100%;max-width:520px;background:#12151d;border:1px solid #252a36;
  border-radius:24px;padding:26px;box-shadow:0 15px 50px #0008
}
h1{text-align:center;margin:0 0 8px;font-size:27px}
.sub{text-align:center;color:#aeb4c2;margin-bottom:25px}
input{
 width:100%;padding:15px;border-radius:12px;border:1px solid #343a49;
 background:#0d1016;color:#fff;font-size:16px;outline:none
}
button{
 border:0;border-radius:12px;padding:14px 16px;font-size:16px;
 font-weight:bold;cursor:pointer;background:#5865f2;color:white
}
.primary{width:100%;margin-top:14px}
.progress-text{display:flex;justify-content:space-between;color:#aeb4c2;font-size:14px;margin:12px 0 7px}
.progress{height:9px;background:#292e39;border-radius:10px;overflow:hidden}
.bar{height:100%;background:#5865f2;width:0%;transition:.25s}
.question{font-size:21px;text-align:center;line-height:1.4;margin:28px 0}
.answers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.answers button{background:#202532}
.answers button:hover{background:#5865f2}
.hidden{display:none}
.result{text-align:center}
.type{font-size:22px;font-weight:bold;margin:12px 0 22px}
.score{color:#b9bfcc}
.trait{margin:15px 0;text-align:left}
.trait-head{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.trait-bg{height:10px;background:#292e39;border-radius:10px;overflow:hidden}
.trait-fill{height:100%;background:#5865f2;border-radius:10px}
.card{
 margin-top:20px;padding:15px;border-radius:15px;background:#1a1e28;
 text-align:left;line-height:1.5;color:#d8dce5
}
.restart{margin-top:20px;width:100%}
.small{font-size:12px;color:#858c9b;margin-top:20px;text-align:center}
</style>
</head>
<body>
<div class="app">

<section id="welcome">
  <h1>PERSONALITY ANALYZER</h1>
  <div class="sub">Discover your personality profile</div>
  <input id="name" placeholder="Enter your name">
  <button class="primary" onclick="startTest()">START TEST</button>
  <div class="small">Fun personality quiz — not a psychological diagnosis.</div>
</section>

<section id="quiz" class="hidden">
  <div class="progress-text">
    <span id="qnum"></span><span id="percent"></span>
  </div>
  <div class="progress"><div id="bar" class="bar"></div></div>
  <div id="question" class="question"></div>
  <div class="answers">
    <button onclick="answer(1)">1</button>
    <button onclick="answer(2)">2</button>
    <button onclick="answer(3)">3</button>
    <button onclick="answer(4)">4</button>
    <button onclick="answer(5)">5</button>
  </div>
  <div class="small">1 = Not at all &nbsp; • &nbsp; 5 = Very much</div>
</section>

<section id="result" class="hidden result">
  <h1>YOUR PERSONALITY REPORT</h1>
  <div id="summary"></div>
  <div id="traits"></div>
  <div id="cards"></div>
  <button class="restart" onclick="location.reload()">RETAKE TEST</button>
</section>

</div>

<script>
const questions=[
["Do you enjoy talking to new people?","social"],
["Do you like attending social events?","social"],
["Do you solve problems logically?","logic"],
["Do you enjoy puzzles and problem solving?","logic"],
["Do you enjoy being creative?","creativity"],
["Do you like creating new ideas?","creativity"],
["Do you like helping other people?","empathy"],
["Do you understand other people's feelings?","empathy"],
["Do you like leading a group?","leadership"],
["Are you confident in making decisions?","leadership"],
["Do you stay calm under pressure?","calmness"],
["Do you think before reacting to problems?","calmness"]
];

const names={
social:"Social Skills",logic:"Logical Thinking",creativity:"Creativity",
empathy:"Empathy",leadership:"Leadership",calmness:"Calmness"
};

const analysis={
social:"You are comfortable communicating with people and building new connections.",
logic:"You prefer logical thinking and enjoy solving problems.",
creativity:"You have a creative mindset and enjoy generating new ideas.",
empathy:"You care about others and are good at understanding different perspectives.",
leadership:"You are comfortable taking responsibility and making decisions.",
calmness:"You tend to stay composed and think before reacting."
};

const suggestions={
social:"Try communicating with new people more often.",
logic:"Try puzzles, coding and problem-solving activities.",
creativity:"Try drawing, designing, writing or creating new projects.",
empathy:"Try listening carefully to other people's perspectives.",
leadership:"Try taking responsibility for small group activities.",
calmness:"Try pausing and thinking before reacting to stressful situations."
};

let index=0, userName="", scores={social:0,logic:0,creativity:0,empathy:0,leadership:0,calmness:0};

function startTest(){
 userName=document.getElementById("name").value.trim();
 if(!userName){document.getElementById("name").focus();return}
 document.getElementById("welcome").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 showQuestion();
}

function showQuestion(){
 const q=questions[index];
 document.getElementById("qnum").textContent=`Question ${index+1} / ${questions.length}`;
 const p=Math.round(index/questions.length*100);
 document.getElementById("percent").textContent=p+"%";
 document.getElementById("bar").style.width=p+"%";
 document.getElementById("question").textContent=q[0];
}

function answer(value){
 scores[questions[index][1]]+=value;
 index++;
 if(index<questions.length) showQuestion();
 else showResult();
}

function showResult(){
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");

 let total=Object.values(scores).reduce((a,b)=>a+b,0);
 let max=questions.length*5;
 let overall=total/max*100;

 let personality;
 if(overall>=80) personality="Confident Explorer";
 else if(overall>=65) personality="Creative Leader";
 else if(overall>=50) personality="Balanced & Practical";
 else if(overall>=35) personality="Calm & Thoughtful";
 else personality="Quiet Observer";

 let strongest=Object.keys(scores).reduce((a,b)=>scores[a]>scores[b]?a:b);
 let weakest=Object.keys(scores).reduce((a,b)=>scores[a]<scores[b]?a:b);

 document.getElementById("summary").innerHTML=
 `<div><b>Name:</b> ${escapeHTML(userName)}</div>
  <div class="score">Overall Score: ${total}/${max} • ${overall.toFixed(1)}%</div>
  <div class="type">${personality}</div>`;

 let traitHTML="";
 for(const trait in scores){
   let pct=scores[trait]/10*100;
   traitHTML+=`
   <div class="trait">
    <div class="trait-head"><span>${names[trait]}</span><span>${Math.round(pct)}%</span></div>
    <div class="trait-bg"><div class="trait-fill" style="width:${pct}%"></div></div>
   </div>`;
 }
 document.getElementById("traits").innerHTML=traitHTML;

 document.getElementById("cards").innerHTML=
 `<div class="card"><b>Strongest Trait</b><br>${names[strongest]}</div>
  <div class="card"><b>Area to Improve</b><br>${names[weakest]}</div>
  <div class="card"><b>Personal Analysis</b><br>${analysis[strongest]}</div>
  <div class="card"><b>Suggestion</b><br>${suggestions[weakest]}</div>`;
}

function escapeHTML(text){
 return text.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
</script>
</body>
</html>
